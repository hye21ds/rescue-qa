</style></head><body><header><h1>119 구급 출동 — 교수님 질문 검색표</h1><div class="hint">PPT·정리 PDF·11/03 애자일 기록 기반 + 필수 발표 5항목 추가 질문. 노션 원본 직접 확인 불가. 단어 예: Brier, 관외, 47%, 스프린트, GIS, 8분</div><div class="search-row"><input id="search" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="교수님 질문 키워드 검색" placeholder="예: Brier, 8분, 스프린트"><button id="clear" type="button" aria-label="검색어 지우기">×</button></div><div id="tabs" class="tabs"></div><span id="count" class="count"></span></header><main id="items" class="wrap"></main><script>const R=[{"cat":"프로젝트","kw":"목적 목표 무엇 예측 도착시간 확률","q":"무엇을 예측하나요?","ans":"신고 시점의 정보로 119안전센터별 8분 이내 현장 도착 확률을 예측하는 연구입니다.","detail":"정확히 몇 분에 도착하는지 예측하는 회귀 문제가 아니라 8분 초과 여부를 바탕으로 확률을 추정합니다.","src":"PPT 1·4 / PDF 2","warning":""},{"cat":"프로젝트","kw":"8분 기준 골든타임 생존율","q":"왜 8분인가요?","ans":"2024년 서울 출동의 약 47.9%가 8분을 초과해 분석 기준으로 선택했습니다.","detail":"중앙값은 약 8분입니다. 심정지 선행연구를 모든 구급 출동의 생존율 근거로 일반화하면 안 됩니다.","src":"PPT 4·19 / PDF 2·6","warning":"PPT 19의 임상 수치는 대상·처치·시점이 달라 직접 일반화 금지."},{"cat":"프로젝트","kw":"서울 지역 선정 이유 전국","q":"왜 서울을 선택했나요?","ans":"교통·기상 자료를 함께 확보하기 좋고, 서울에서도 시간대와 신고 몰림 등 거리 외 요인의 차이를 분석할 수 있기 때문입니다.","detail":"2024년 전국 평균 8분 초과율은 56.4%, 서울은 47.9%입니다.","src":"PDF 7·30","warning":""},{"cat":"프로젝트","kw":"안전센터 5곳 후보 비교 선택","q":"왜 안전센터 다섯 곳을 비교하나요?","ans":"신고 위치 주변의 후보 안전센터를 대상으로 예측 확률을 비교해 보여 주기 위한 서비스 설계입니다.","detail":"후보 5곳의 선택 방식과 실제 미출동 센터의 반사실적 결과는 검증이 남아 있습니다.","src":"PPT 1·11 / PDF 24·31","warning":"다른 안전센터가 실제 출동했다면 어떻게 됐을지는 관측 자료만으로 검증 불가."},{"cat":"프로젝트","kw":"실제 사용 구급차 배차 지령 운영","q":"실제 119 배차에 사용할 수 있나요?","ans":"아닙니다. 현재는 연구용 참고 정보이며 실제 출동 지령에 사용하지 않습니다.","detail":"실제 서비스 적용에는 안전성·일반화·미출동 센터 예측의 검증이 추가로 필요합니다.","src":"PDF 2·31","warning":""},{"cat":"프로젝트","kw":"현재 상태 어디까지 구현 완료 진행","q":"현재 어디까지 진행됐나요?","ans":"HDFS 적재·Spark 정제·EDA와 기준 모델 G0의 1차 예비 학습·보정을 확보했고, 웹은 가상 값 목업 단계입니다.","detail":"피처 확장·2025 최종평가·API 연동·스트리밍·배포는 후속 계획입니다.","src":"PPT 6~12 / PDF 3·31~32","warning":""},{"cat":"프로젝트","kw":"Q0 기본모델 기본정보","q":"Q0가 무엇인가요?","ans":"센터·구·시간·요일·월·공휴일·관외출동·거리 같은 기본 정보로 8분 초과를 얼마나 예측하는지 묻는 질문입니다.","detail":"G0 LightGBM을 기준 모델로 둡니다.","src":"PPT 4·9 / PDF 20","warning":""},{"cat":"프로젝트","kw":"Q1 신고 몰림 활동량","q":"Q1은 무엇인가요?","ans":"기본 정보에 신고 직전 60분의 같은 구 신고 건수 등 활동량을 더할 때 예측이 개선되는지 확인합니다.","detail":"현재 EDA 결과와 실제 학습 피처 완성 상태는 구분합니다.","src":"PPT 4·8 / PDF 9·14","warning":""},{"cat":"프로젝트","kw":"Q2 교통 정체 날씨","q":"Q2는 무엇인가요?","ans":"기본 정보에 교통 정체 지수를 추가할 때 예측이 개선되는지 확인합니다. 날씨도 별도 단계로 추가합니다.","detail":"","src":"PPT 4·10 / PDF 2·22","warning":""},{"cat":"데이터","kw":"원천 데이터 4종 출처 소방청 TOPIS 기상청 관할","q":"어떤 데이터를 썼나요?","ans":"소방청 구급 출동 기록, 서울시 TOPIS 차량 통행속도, 기상청 ASOS 기상 자료, 119안전센터 관할구역 정보입니다.","detail":"","src":"PPT 5 / PDF 9·31","warning":""},{"cat":"데이터","kw":"기간 2019 2025 7년","q":"분석 기간이 어떻게 되나요?","ans":"서울 구급 출동 원본은 2019~2025년 7개년을 다루고, 모델은 2019~2024년으로 학습·검증·보정하며 2025년을 최종 시험 구간으로 남겨 두었습니다.","detail":"","src":"PPT 9 / PDF 20","warning":""},{"cat":"데이터","kw":"원본 건수 3613740 3345090 550251 528744","q":"왜 데이터 건수가 여러 개죠?","ans":"서로 다른 집계 범위 때문입니다. 7년 서울 원본은 3,613,740건, 정제 후 3,345,090건이며 서울 2024 정제 코호트 550,251건, 안전센터 2024 분석 집단 528,744건 등 목적별 모집단이 다릅니다.","detail":"그래프마다 서울 2024 전체인지 안전센터 2024인지 표기해야 합니다.","src":"PPT 5·6 / PDF 9·11","warning":"수치를 서로 같은 모집단처럼 섞어 비교하지 않음."},{"cat":"데이터","kw":"47.9 48.2 차이 초과율","q":"47.9%와 48.2%가 왜 다르죠?","ans":"47.9%는 서울 2024 전체 정제 분석의 초과율, 48.2%는 안전센터 2024 분석 집단의 초과율로 모집단이 다릅니다.","detail":"","src":"PPT 4·5·9 / PDF 6·9·20","warning":""},{"cat":"데이터","kw":"중앙값 평균 P90 기초통계","q":"중앙값이 8분이라는 건 무슨 뜻인가요?","ans":"도착 소요시간을 순서대로 나열했을 때 가운데 위치한 값이 약 8분이라는 뜻입니다.","detail":"평균은 모든 값을 합해 개수로 나눈 값이고 P90은 약 90%의 기록이 그 값 이하에 있는 지점입니다.","src":"PPT 5 / PDF 9","warning":""},{"cat":"데이터","kw":"관외출동 관내 관할구 19.1","q":"관외출동은 무엇인가요?","ans":"신고가 발생한 구와 출동 안전센터의 소속 구가 다른 경우입니다.","detail":"안전센터 2024에서 관외출동 비율은 약 19.1%입니다.","src":"PPT 5·8 / PDF 9·32","warning":""},{"cat":"전처리","kw":"전처리 정제 94퍼 취소 시각","q":"전처리는 무엇을 했나요?","ans":"취소, 신고·도착 시각 결측, 시간 역전, 180분 초과 등 정해진 규칙으로 제외해 분석에 적합한 기록을 남겼습니다.","detail":"서울 2024는 585,503건에서 550,251건으로 약 94.0%를 남겼습니다.","src":"PPT 6 / PDF 11","warning":""},{"cat":"전처리","kw":"180분 60분 이상치 제외","q":"왜 180분 초과를 제외했나요?","ans":"정제 규칙에 따라 180분 초과 기록을 제외했고 60~180분 기록은 유지했습니다.","detail":"이 기준의 외부 임상적 타당성은 제공 자료에서 별도로 입증되지 않았습니다.","src":"PDF 11","warning":""},{"cat":"전처리","kw":"거리 음수 100km 6km 결측 행 유지","q":"거리 이상치는 어떻게 처리했나요?","ans":"거리 음수와 100km 초과 값은 거리 변수만 결측 처리하고 행은 남겼습니다. 6km 초과를 곧바로 오류로 단정해 삭제하지는 않았습니다.","detail":"2024년 해당 사례: 음수 4건, 100km 초과 20건, 6km 초과 4,660건.","src":"PPT 6 / PDF 11","warning":""},{"cat":"전처리","kw":"결측치 누락 행 제거 이유","q":"결측값이 있으면 행을 삭제하나요?","ans":"라벨이 유효한 행은 가능한 유지하고, 잘못된 거리값이나 결합되지 않은 외부 변수는 결측으로 표시해 모델 간 비교 대상을 맞춥니다.","detail":"","src":"PDF 12·30","warning":""},{"cat":"전처리","kw":"누출 데이터누수 미래정보 사후변수","q":"데이터 누출이 무엇인가요?","ans":"예측 시점에 알 수 없는 미래 또는 사후 정보가 학습에 들어가 실제보다 좋은 결과가 나오는 문제입니다.","detail":"날씨·교통·신고 몰림은 신고 시점 전에 확정된 정보만 쓰도록 설계했습니다.","src":"PPT 6·15 / PDF 12·32","warning":""},{"cat":"전처리","kw":"거리 사후기록 GIS 검증 완료 D+ D-","q":"출동 거리는 사후 기록 아닌가요?","ans":"그 가능성이 있으므로 거리 포함(D+)과 제외(D−) 설정을 모두 비교해 사후 정보에 대한 의존성을 검토할 계획입니다.","detail":"실제 서비스에서는 도로 거리로 대체할 계획입니다.","src":"PPT 6·17 / PDF 30","warning":"PPT 14의 GIS 출발 시점 자동 산출·검증 완료 주장은 공유된 정리 PDF로 확인되지 않음."},{"cat":"전처리","kw":"실제 거리 도로 거리 경로 API 좌표","q":"실제 서비스의 거리는 어떻게 산출하나요?","ans":"신고 위치와 센터 위치를 기반으로 도로망상의 거리를 계산해 대체할 계획입니다.","detail":"도로 거리·경로 API 구현 및 검증은 완료 상태가 아닙니다.","src":"PPT 17 / PDF 30","warning":""},{"cat":"전처리","kw":"신고 몰림 왜 정제 전 취소 포함","q":"취소 신고도 신고 몰림에 포함하나요?","ans":"취소된 신고도 센터 운영에 영향을 줄 수 있어 정제 전 기록에서 신고 직전 60분 건수를 계산하도록 설계했습니다.","detail":"현재 신고 자체는 집계에서 제외합니다.","src":"PDF 11","warning":""},{"cat":"전처리","kw":"강수 3시간 누적 ASOS QC","q":"비는 어떻게 처리하나요?","ans":"기상청 관측 자료의 품질 표시를 반영하고 신고 전 3시간 누적 강수를 생성해 사용합니다.","detail":"신고 60분 이상 전에 종료된 관측값만 사용해 미래 정보 누출을 줄입니다.","src":"PDF 12","warning":""},{"cat":"전처리","kw":"교통 시간 표기 평소 속도 학습기간","q":"교통 데이터를 어떻게 전처리하나요?","ans":"시간 표기를 통일하고 신고 직전 교통 속도를 집계합니다. 정체 지수의 기준이 되는 평소 속도는 학습 기간만으로 계산합니다.","d .206 0.209 낮음","q":"Brier Score는 무엇인가요?","ans":"예측 확률과 실제 0·1 결과 사이의 제곱오차 평균으로, 낮을수록 좋습니다.","detail":"2024 보정 구간 예비 결과: 로지스틱 0.206, G0 0.209. 차이가 크지 않습니다.","src":"PPT 10 / PDF 22","warning":""},{"cat":"평가","kw":"확률 보정 calibration 41 48","q":"확률 보정이 왜 필요한가요?","ans":"예측 확률이 실제 발생 비율에 더 잘 맞도록 조정하기 위해서입니다.","detail":"학습 기간 초과율 약 41%와 2024년 약 48%의 차이를 고려해 보정 곡선을 확인했습니다.","src":"PPT 10 / PDF 22","warning":""},{"cat":"평가","kw":"보정곡선 대각선 reliability","q":"보정 곡선의 대각선은 무슨 뜻인가요?","ans":"예측 확률이 30%인 집단에서 실제 발생 비율도 약 30%인 것처럼 예측 확률과 관측 비율이 일치하면 대각선에 가깝습니다.","detail":"","src":"PDF 22","warning":""},{"cat":"평가","kw":"2025 최종평가 시험 한 번 설계 동결","q":"왜 2025년은 마지막에 한 번만 평가하나요?","ans":"시험 결과를 보면서 모델을 계속 고르면 평가가 낙관적으로 변하므로, 설계를 확정한 뒤 독립적으로 확인하기 위해서입니다.","detail":"현재 2025년 최종 성능이 확보된 것으로 발표하면 안 됩니다.","src":"PPT 9·10 / PDF 20·22","warning":""},{"cat":"평가","kw":"날짜 블록 신뢰구간 부트스트랩","q":"날짜 블록 신뢰구간은 무엇인가요?","ans":"같은 날 출동들이 공통 환경을 공유한다는 점을 고려해 날짜 단위로 다시 표본을 뽑아 성능 개선폭의 불확실성을 계산하려는 방법입니다.","detail":"현재 자료에서는 신뢰구간 산출 전으로 표시되어 있습니다.","src":"PPT 10 / PDF 22","warning":""},{"cat":"평가","kw":"추가 실험 ΔBrier 비교 동일 조건","q":"변수를 추가했을 때 개선은 어떻게 판단하나요?","ans":"G0에 강수, 신고 몰림, 정체를 단계적으로 더하고 같은 데이터·분할·튜닝 조건에서 Brier 차이와 신뢰구간을 비교합니다.","detail":"","src":"PPT 10 / PDF 22","warning":""},{"cat":"평가","kw":"SHAP 해석 중요도 기여","q":"SHAP은 무엇인가요?","ans":"개별 예측에서 각 변수가 모델 출력에 어떻게 기여했는지 설명하기 위한 모델 해석 기법입니다.","detail":"현재 자료에서 SHAP 결과를 확보했다고 확인되지는 않으며 후속 계획입니다.","src":"PPT 12 / PDF 3","warning":""},{"cat":"기술","kw":"HDFS 하둡 저장","q":"HDFS는 무엇인가요?","ans":"Hadoop의 분산 파일 시스템으로, 원본과 처리 결과 데이터를 저장·관리하는 데 사용했습니다.","detail":"현재는 단일 서버 환경으로 다중 노드 클러스터를 운영했다는 뜻이 아닙니다.","src":"PPT 6·7 / PDF 31","warning":""},{"cat":"기술","kw":"Spark PySpark 배치 정제","q":"Spark는 어디에 사용했나요?","ans":"구급 출동 원본의 정제와 연도별 집계에 PySpark 배치 처리를 사용했습니다.","detail":"실시간 Structured Streaming은 후속 계획입니다.","src":"PPT 6·7 / PDF 31~32","warning":""},{"cat":"기술","kw":"11GB 3억행 8200만회 추정","q":"데이터가 11GB인데 빅데이터인가요?","ans":"원본 약 11GB보다 시계열 결합과 피처 생성 연산이 중요합니다. 교통 링크별 시간 집계 약 3억 행과 경로 정트리가 적합한 경우는요?","ans":"어떤 조건에서 생존율이 높아지는지 사람이 읽을 수 있는 분기 규칙을 확인할 때 사용합니다.","detail":"규칙의 생존율은 학습 데이터 기준으로 일반화·인과를 주장하지 않습니다.","src":"PPT 3 / PDF 26~27","warning":""},{"cat":"타이타닉","kw":"랜덤 포레스트 안정성 0.102 0.071","q":"랜덤 포레스트를 선택하는 이유는요?","ans":"여러 트리 예측을 결합해 단일 결정트리보다 예측의 흔들림을 줄이는 데 유리할 수 있기 때문입니다.","detail":"과제 결과 승객별 예측 흔들림은 0.102에서 0.071로 감소했습니다.","src":"PPT 3 / PDF 27","warning":""},{"cat":"타이타닉","kw":"중첩 5겹 교차검증","q":"중첩 교차검증이 무엇인가요?","ans":"모델 설정을 고르는 과정과 최종 성능을 평가하는 과정을 구분하는 검증 방법입니다.","detail":"타이타닉 과제에서 모델 성능 비교를 같은 조건으로 수행했습니다.","src":"PPT 3 / PDF 27","warning":""},{"cat":"애자일","kw":"애자일 Agile 왜 도입","q":"애자일을 왜 사용했나요?","ans":"38개 개발 작업을 작은 단위로 분리하고 담당·인수 조건·근거·다음 행동을 연결해 진행 상황과 남은 범위를 관리하기 위해서입니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"제품 백로그 Product Backlog 38개","q":"Product Backlog가 무엇인가요?","ans":"전체 개발 작업 목록입니다. 38개 작업에 담당·스프린트·포인트·인수 조건·최신 근거·다음 행동을 정리했습니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"칸반 Kanban 완료 9 진행 9","q":"칸반 상태는 어떻게 되나요?","ans":"완료 9, 진행 중 9, 검증 중 1, To-do 3, Stories 16으로 38개 작업을 구분해 관리합니다.","detail":"이 숫자는 작업 개수이지 완성도 비율이 아닙니다.","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"Sprint 스프린트 S1 S2 S3 S4 S5","q":"스프린트는 무엇이며 어디까지 진행됐나요?","ans":"짧은 개발 주기로, 현재 S1~S3에 걸친 일부 성과만 확보했습니다. S1이나 S2가 전체 완료됐다고 표시하지 않습니다.","detail":"실제 기간과 이월 작업은 팀 Planning에서 확정합니다.","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"S1 데이터 환경 원천 EDA","q":"S1은 무엇을 했나요?","ans":"원천 데이터 확인, 정제 재현, EDA, 기상·통행속도 확보 성과가 있고 복귀 복원 검증·실시간 수집 안정화·공통 환경 검증은 남았습니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"S2 HDFS Spark 파이프라인","q":"S2는 무엇을 했나요?","ans":"HDFS 적재, Spark 정제, 연도별 집계, 시간순 분할을 확보했고 전체 피처 생성·결합과 실제 API는 남았습니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"S3 LR G0 모델 확률 보정","q":"S3는 무엇을 했나요?","ans":"기준 모델, 로지스틱 회귀, G0의 1차 학습과 확률 보정 예비 결과를 확보했습니다. 추가 모델·피처 비교와 신뢰구간 등은 남았습니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"S4 통합 배포 2025","q":"S4는 무엇을 하나요?","ans":"설계 동결 뒤 2025 최종평가, 모델·API·웹·스트림 통합 및 배포가 주요 후속 범위입니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"S5 최종검증 소논문","q":"S5는 무엇을 하나요?","ans":"성능 측정, 독립 재현, 통합 회귀 테스트, 소논문 작성과 최종발표를 계획합니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"Daily Scrum 9건 회의 매일","q":"Daily Scrum을 매일 진행했나요?","ans":"9건의 진행 기록이 있지만 매일 회의를 9번 개최했다는 증거는 아닙니다. 문서 기반 진행 기록 8건과 11월 3일 실제 자료 정리 1건입니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"Review Retrospective 리뷰 회고 2건","q":"리뷰·회고는 어떤 내용인가요?","ans":"중간발표 결과의 문서 점검과 자료 정리 개선안 두 건을 기록해 후속 작업으로 연결했습니다.","detail":"과거 팀 회의 개최 기록과 구분합니다.","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"번다운 Burn-down 차트 144 24 120 SP","q":"번다운 차트는 무엇인가요?","ans":"백로그 잔여 작업량을 포인트로 보여 주는 차트입니다. 현재 전체 144SP 중 완료 24SP·잔여 120SP입니다.","detail":"진행선은 확인일 기준 재구성, 계획선은 선형 참고값입니다. 실제 일별 실측이나 프로젝트 전체 완성도 아님.","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"Story Point SP 16.7 완성도","q":"SP는 무엇인가요?","ans":"작업의 상대적인 규모·난이도를 추정하는 단위입니다. 24/144SP는 완료 백로그 포인트 비율이지 전체 프로젝트 완성도나 개인 생산성 점수가 아닙니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"애자일","kw":"인수조건 Acceptance Criteria 완료 기준","q":"인수 조건은 무엇인가요?","ans":"작업을 완료했다고 판단할 수 있는 검증 가능한 기준입니다. 백로그 카드에 담당·결과 근거와 함께 기록합니다.","detail":"","src":"사용자 제공 11/03 애자일 기록","warning":""},{"cat":"일정·역할","kw":"R&R 역할 팀원 누구","q":"팀원 역할은 어떻게 나뉘나요?","ans":"최동혁 데이터·EDA, 길현수 모델·평가, 함인수 교통·기상, 유혜나 DevOps·서비스 역할로 PPT에 표시되어 있습니다.","detail":"","src":"PPT 12","warning":""},{"cat":"일정·역할","kw":"11월 12월 향후 일정 소논문","q":"기말까지 무엇을 할 계획인가요?","ans":"11월에는 강수·신고 몰림·정체 피처와 모델 비교 및 2025 최종평가, 12월에는 화면 연동·배포·검증과 소논문 마무리를 계획했습니다.","detail":"구체 날짜는 팀 확정 일정과 변경 여부 확인이 필요합니다.","src":"PPT 11 / PDF 24","warning":""},{"cat":"일정·역할","kw":"최종 산출물 결과물 소논문 웹","q":"최종 산출물은 무엇인가요?","ans":"실험 결과를 담은 소논문, 단계별 성능 검증표, 빅데이터 처리 파이프라인, 모델과 연결된 웹 시스템, 배포·저장소입니다.","detail":"","src":"PPT 12 / PDF 25","warning":""},{"cat":"주의","kw":"GIS 로그 자동산출 검증완료","q":"GIS 로그로 거리를 검증했나요?","ans":"공유된 PDF에서는 GIS 로그로 출발 시점 자동 산출을 검증했다는 근거를 확인할 수 없습니다. 사후 기록 가능성을 인정하고 거리 포함·제외 실험을 계획했다고 답해야 합니다.","detail":"","src":"PPT 14와 PDF 30의 표현 차이","warning":"PPT 14의 단정적인 문구를 사용하지 않음."},{"cat":"주의","kw":"성능 입증 LightGBM 우월 빠른 추론","q":"LightGBM의 우월성이나 배포 성능을 입증했나요?","ans":"아닙니다. 기본 정보에서는 로지스틱과 유사한 예비 결과이며 추가 변수 실험과 성능 검증이 남아 있습니다.","detail":"","src":"PPT 14·16 / PDF 22","warning":"추론 지연 대폭 단축·입증 등의 단정 금지."},{"cat":"주의","kw":"분산 클러스터 구축 확장 완료","q":"Spark 클러스터를 구축했나요?","ans":"서버 단일 노드에서 HDFS·Spark를 사용한 것으로 정리되어 있습니다. 다중 노드 클러스터나 전국 규모 확장 성능 검증을 완료했다고 할 수 없습니다.","detail":"","src":"PPT 7 / PDF 12","warning":""},{"cat":"주의","kw":"임상 심정지 생존율 8분 절대","q":"8분을 넘으면 생존율이 급락하나요?","ans":"PPT 19의 심정지 관련 문헌 수치를 모든 구급 출동에 직접 적용할 수는 없습니다. 본 연구에서는 서울 도착시간 분포와 8분 초과율을 근거로 분석 기준을 정했다고 설명하는 것이 안전합니다.","detail":"","src":"PPT 19 / PDF 6","warning":"임상적 인과·일반화 금지."},{"cat":"심화·연구설계","kw":"분류 회귀 이진 타깃 라벨 8분 이내 초과 역변환","q":"8분 초과를 학습하는데 왜 화면에는 8분 이내 확률을 보여주나요?","ans":"모델이 8분 초과를 1로 예측한다면 화면의 8분 이내 확률은 1에서 초과 확률을 뺀 값입니다.","detail":"이진 사건과 여집합의 관계입니다. 정확히 8분인 기록은 초과가 아닌 이내로 분류합니다.","src":"PPT 4 / 정리 PDF 2·32","warning":""},{"cat":"심화·연구설계","kw":"정확히 8분 8분 이내 경계 부등호","q":"도착 시간이 정확히 8분이면 어느 집단인가요?","ans":"정리 자료의 라벨은 8분 초과일 때 1이므로 정확히 8분이면 초과가 아닌 8분 이내 집단입니다.","detail":"초과는 >8분, 이내는 ≤8분입니다.","src":"정리 PDF 32","warning":""},{"cat":"심화·연구설계","kw":"센터별 후보 미출동 반사실 선택편향 counterfactual","q":"실제로 출동하지 않은 센터의 도착 확률은 어떻게 검증하나요?","ans":"현재 관측된 실제 출동만으로 다른 센터가 출동했을 때의 결과는 직접 검증하기 어렵습니다. 그래서 센터별 비교 화면은 연구용이며, 반사실적 검증과 안전성 검토가 추가로 필요합니다.","detail":"이 부분은 서비스 목표의 핵심 한계입니다.","src":"정리 PDF 31 / PPT 1·11","warning":"미출동 센터의 예측 확률이 현장 검증까지 완료됐다고 주장하지 않음."},{"cat":"심화·연구설계","kw":"가장 가까운 센터 최적배차 최적화 예측 차이","q":"확률이 가장 높은 센터를 자동 배차하면 되지 않나요?","ans":"본 연구는 센터별 확률 예측과 비교를 목표로 하며 실제 배차 최적화나 지령 의사결정을 검증한 연구가 아닙니다.","detail":"가용 차량·출동 우선순위·실제 이동 경로 등의 운영 제약은 현재 검증 범위 밖입니다.","src":"정리 PDF 2·31 / PPT 1","warning":"최적 배차·배차 개선 입증 표현 금지."},{"cat":"심화·연구설계","kw":"기준 7분 9분 10분 임계값 민감도 왜","q":"8분이 아니라 7분이나 10분이면 결과가 달라지나요?","ans":"분할 경계가 달라지면 초과율도 달라집니다. 자료에는 7분 61.8%, 8분 47.9%, 9분 36.0%, 10분 26.5%로 나와 있어 임계값 민감도를 확인했습니다.","detail":"이 수치는 임계값을 바꿨을 때 초과율이며 모델의 실제 예측 성능 변화를 의미하지 않습니다.","src":"정리 PDF 6","warning":""},{"cat":"심화·연구설계","kw":"2024 2025 미래 평가 통계 시험셋 열람","q":"2025년 데이터가 이미 있는데 왜 분석에 안 넣나요?","ans":"2025년을 최종 시험 구간으로 남겨 모델 설계·튜닝에 활용하지 않기 위해서입니다. 설계가 고정된 뒤 한 차례 평가할 계획입니다.","detail":"시험 데이터의 결과를 미리 보고 모델을 수정하면 독립 평가의 의미가 약해집니다.","src":"PPT 9·10 / 정리 PDF 20·22","warning":""},{"cat":"심화·연구설계","kw":"원인 예측 상관 인과 confounding 혼란변수","q":"관외출동이 지연의 원인이라고 볼 수 있나요?","ans":"같은 거리 조건에서도 관외출동과 초과율 사이 차이는 관찰됐지만, 관측자료의 연관만으로 인과효과를 입증하지는 못합니다.","detail":"지역·시간대·현장 상황 같은 교란 요인이 남아 있을 수 있습니다.","src":"PPT 8 / 정리 PDF 13·31","warning":""},{"cat":"심화·연구설계","kw":"표본선택 편향 제외 취소 정제 94 대표성","q":"취소·긴 출동을 제외하면 표본 편향이 생기지 않나요?","ans":"그럴 가능성은 있습니다. 현재는 도착시간 라벨의 신뢰성을 확보하기 위한 정제 규칙을 적용했고, 제외 집단과 남은 집단의 차이는 별도 한계로 검토해야 합니다.","detail":"정제 규칙 자체가 편향이 없음을 입증했다는 자료는 없습니다.","src":"정리 PDF 11·30 / 심화 추론","warning":""},{"cat":"심화·연구설계","kw":"단일 연도 일반화 서울 외부 검증 타지역","q":"서울에서 학습한 모델을 다른 지역에 적용할 수 있나요?","ans":"현재 연구 범위는 서울이며 타지역 일반화 성능은 검증되지 않았습니다. 다른 지역에 적용하려면 데이터 분포와 모델 성능을 별도로 평가해야 합니다.","detail":"","src":"PPT 4 / 정리 PDF 7·31 / 심화 추론","warning":""},{"cat":"심화·전처리","kw":"180분 기준 왜 179 181 경계 민감도","q":"180분 초과는 왜 오류로 보고 제외하나요?","ans":"현재 정제 규칙상 180분 초과를 제외하고 60~180분은 유지했습니다. 다만 180분이라는 임계값의 외부 검증 근거는 자료에 제시되지 않아, 기준을 바꾼 민감도 분석이 필요할 수 있습니다.","detail":"근거가 없는 임상 기준을 만들어 설명하지 않습니다.","src":"정리 PDF 11 / 심화 추론","warning":"180분 기준이 의학적으로 검증됐다고 단정 금지."},{"cat":"심화·전처리","kw":"결측치 대치 imputing missing missingness","q":"거리 결측을 그냥 두면 모델에 문제가 없나요?","ans":"거리 오류는 행을 삭제하지 않고 결측으로 처리했다는 것까지 확인됩니다. 이후 모델별 결측 처리 방법과 결측 여부 자체의 영향은 실험에서 확인해야 합니다.","detail":"LightGBM과 로지스틱 회귀가 결측값을 동일하게 처리한다고 가정하면 안 됩니다.","src":"PPT 6 / 정리 PDF 11·30 / 심화 추론","warning":""},{"cat":"심화·전처리","kw":"시간대 타임존 Asia Seoul DST 시차","q":"신고 시각과 기상·교통 데이터의 시간은 어떻게 맞췄나요?","ans":"자료에는 시간 표기를 통일하고 신고 전 확정된 관측값만 결합하도록 설계했다고 적혀 있습니다. 다만 모든 소스의 타임존 검증 결과까지는 제시되지 않았습니다.","detail":"서버 Spark 실행 예시에는 Asia/Seoul 시간대를 지정합니다.","src":"정리 PDF 12·29 / 심화 추론","warning":""},{"cat":"심화·전처리","kw":"신고 직전 60분 윈도우 현재행 포함 자기 자신","q":"신고 몰림을 계산할 때 현재 신고도 포함하나요?","ans":"정리 자료에는 신고 직전 60분 건수를 정제 전 전체 기록에서 계산하되 현재 신고 자기 자신은 제외한다고 명시되어 있습니다.","detail":"","src":"정리 PDF 11","warning":""},{"cat":"심화·전처리","kw":"취소 신고 실제 부하 취소건수","q":"취소된 신고를 왜 신고 몰림에 포함하나요?","ans":"취소된 신고도 신고 접수와 자원 운영에 영향을 줄 수 있다는 가정으로, 신고 몰림은 정제 전 기록에서 집계했습니다.","detail":"취소 신고가 실제로 자원을 얼마나 점유했는지는 이 자료만으로 검증되지 않습니다.","src":"정리 PDF 11 / 심화 추론","warning":""},{"cat":"심화·전처리","kw":"강수 3시간 블록 시차 60분 지연 누출","q":"강수량을 신고 직전 값이 아니라 지난 블록으로 계산한 이유는요?","ans":"신고 시점에 아직 확정되지 않은 관측 정보를 사용하지 않기 위해 신고 최소 60분 전에 종료된 3시간 누적 강수를 사용하도록 했습니다.","detail":"자료의 강수 품질 표시 9는 무강수로 처리합니다.","src":"정리 PDF 12","warning":""},{"cat":"심화·전처리","kw":"정체 지수 비율 속도 나누기 평소 기준값","q":"정체 지수는 어떻게 계산했나요?","ans":"자료에 정의된 정체 지수는 신고 직전 1시간의 구 평균 속도를 해당 구의 평소 속도로 나눈 비율입니다. 평소 속도는 학습 기간만으로 계산합니다.","detail":"값이 낮을수록 평소보다 느려 정체가 큰 상태라는 해석이 가능합니다.","src":"정리 PDF 12·32","warning":""},{"cat":"심화·전처리","kw":"날씨 ASOS 108 지점 서울 대표 공간 해상도","q":"관측소 한 곳의 비로 서울 전체 날씨를 설명해도 되나요?","ans":"자료에는 기상청 ASOS 108 관측 자료를 이용했다고 적혀 있지만, 서울 지역의 미세한 공간별 강수 차이를 모두 설명할 수 있는지는 추가 한계입니다.","detail":"현재 자료로 공간별 강수 보간 정확도를 입증할 수 없습니다.","src":"정리 PDF 9 / 심화 추론","warning":""},{"cat":"심화·EDA","kw":"스피어만 0.110 p<0.001 효과크기","q":"상관계수 0.110인데 p값이 작으면 중요한 변수인가요?","ans":"p값이 작다는 것은 무관하다는 가설에 반하는 통계적 근거이고, 상관계수 0.110은 관계의 크기가 약하다는 뜻입니다. 통계적 유의성과 예측 개선은 별도로 봐야 합니다.","detail":"구 신고 몰림은 ρ=0.110, p<0.001로 정리되어 있습니다.","src":"정리 PDF 14 / 심화 방법론","warning":""},{"cat":"심화·EDA","kw":"센터 활동량 0.007 p=0.378 유의성","q":"센터 활동량은 p값도 유의하지 않은데 빼야 하지 않나요?","ans":"단독 관계는 거의 없으므로 예측력이 있다는 결론을 낼 수 없습니다. 다만 결합 모델의 추가 기여 여부는 동일 조건의 후속 실험으로 확인할 수 있습니다.","detail":"센터 활동량 ρ≈0.007이며 자료의 설명은 혼잡 시 인접 센터 대체 출동 가능성을 제시하지만 검증된 인과 설명은 아닙니다.","src":"정리 PDF 15·31 / 심화 추론","warning":""},{"cat":"심화·EDA","kw":"거리 통제 같은 거리 4~9%p 교란","q":"같은 거리로 비교했다는 것이 모든 조건을 통제한 건가요?","ans":"아닙니다. 같은 거리 구간 안에서 관외·관내 차이를 비교했다는 뜻일 뿐 시간대나 지역별 특성까지 완전히 통제됐다는 뜻은 아닙니다.","detail":"관외 +4~9%p는 해당 거리 구간에서 관찰된 차이입니다.","src":"정리 PDF 13 / 심화 추론","warning":""},{"cat":"심화·EDA","kw":"구 활동량 센터 활동량 왜 다른가 선택 효과","q":"구 신고 몰림은 관계가 있는데 센터 활동량은 왜 약할까요?","ans":"구 단위 신고 몰림은 증가 추세가 관찰됐지만 센터 활동량은 거의 평평했습니다. 자료는 인접 센터의 대체 출동 가능성을 설명으로 제시하지만, 이를 입증한 것은 아닙니다.","detail":"","src":"정리 PDF 14~15 / 심화 추론","warning":""},{"cat":"심화·EDA","kw":"강수 5mm 3km 이하 겨울 표본","q":"비가 올 때 지연된다는 결론은 모든 계절에 적용되나요?","ans":"아닙니다. 관찰된 +2.5~3.2%p 차이는 4~10월 3km 이하 출동 조건이며 겨울은 건수가 적어 불확실하다고 기록돼 있습니다.","detail":"","src":"정리 PDF 13·17","warning":""},{"cat":"심화·EDA","kw":"정체 61.9 상호작용 단순 합산 여부","q":"신고 몰림과 교통 정체의 상호작용이 통계적으로 검증됐나요?","ans":"두 조건을 함께 나눈 EDA에서 초과율 차이는 확인했지만, 상호작용 항의 통계적 유의성이나 추가 예측 이득은 후속 모델 비교가 필요합니다.","detail":"61.9%는 특정 집단의 관측 초과율이지 모델 예측 성능이 아닙니다.","src":"정리 PDF 13·18·22 / 심화 추론","warning":""},{"cat":"심화·모델","kw":"LightGBM 학습 원리 트리 잔차 부스팅","q":"LightGBM이 어떻게 학습하나요?","ans":"여러 결정트리를 순차적으로 결합해 이전 단계가 잘 설명하지 못한 패턴을 보완하는 그래디언트 부스팅 계열 모델입니다.","detail":"자료는 G0를 LightGBM으로 설정했다고 명시하지만 트리 깊이 등 최종 설정표는 별도 제시되어 있지 않습니다.","src":"PPT 9 / 정리 PDF 20 / 일반 모델 개념","warning":""},{"cat":"심화·모델","kw":"범주형 센터 구 인코딩 로지스틱 LightGBM","q":"센터·구 같은 범주형 변수는 어떻게 처리했나요?","ans":"G0 입력에 센터와 구를 포함했다는 사실은 확인되지만 인코딩·결측 처리의 구체 구현은 제공 자료만으로 확정하기 어렵습니다.","detail":"PPT만으로 원-핫 인코딩이나 네이티브 범주 처리를 했다고 단정하지 않습니다.","src":"PPT 9 / 정리 PDF 20","warning":"코드를 확인하기 전 구체 인코딩 방법을 만들어 답하지 않음."},{"cat":"심화·모델","kw":"클래스 불균형 class weight 왜 미사용","q":"8분 초과와 이내의 불균형 처리는 어떻게 했나요?","ans":"2024년 서울 초과율은 약 절반 수준이며, 정리 자료의 학습 설명에서는 클래스 가중치를 사용하지 않았다고 합니다.","detail":"연도별 비율이 달라지는 문제는 시간순 평가와 확률 보정으로 따로 점검했습니다.","src":"정리 PDF 6·20·30","warning":""},{"cat":"심화·모델","kw":"초과율 연도별 20.7 50.5 분포이동 drift","q":"2019년과 2024년의 초과율이 다른데 모델을 믿어도 되나요?","ans":"연도별 초과율이 크게 달라 분포 이동 위험이 있습니다. 그래서 과거 학습·미래 평가, 확률 보정, 롤링 검증을 설계했습니다.","detail":"최종 운영 안정성을 검증했다고 뜻하지는 않습니다.","src":"정리 PDF 20·21 / 심화 추론","warning":""},{"cat":"심화·모델","kw":"튜닝 20회 랜덤서치 과적합 검증2023","q":"하이퍼파라미터를 20번 탐색하면 검증 데이터에 과적합되지 않나요?","ans":"검증 구간을 반복 사용하면 선택 편향이 생길 수 있습니다. 그래서 검증과 보정·최종 시험을 시점별로 분리했고 최종 2025 성능은 설계 동결 후 한 번만 확인하도록 했습니다.","detail":"20회 탐색과 조기 종료가 언급되지만 완전한 무편향을 보장하는 것은 아닙니다.","src":"정리 PDF 20·30 / 심화 추론","warning":""},{"cat":"심화·모델","kw":"하이퍼파라미터 조기종료 early stopping","q":"조기 종료는 왜 사용했나요?","ans":"검증 성능이 개선되지 않으면 추가 학습을 멈춰 과적합 위험과 불필요한 학습을 줄이기 위한 방법입니다.","detail":"자료에서는 LightGBM 검증 성능에 따른 조기 종료를 설명합니다.","src":"정리 PDF 30 / 일반 모델 개념","warning":""},{"cat":"심화·모델","kw":"같은 행 비교 공정성 결측 데이터수 일치","q":"모델마다 데이터 건수가 다르면 왜 안 되나요?","ans":"모델별로 다른 행을 평가하면 성능 차이가 변수 효과 때문인지 평가 대상 차이 때문인지 구분하기 어려워집니다. 그래서 같은 행·분할·튜닝 조건으로 비교하도록 설계했습니다.","detail":"","src":"정리 PDF 22·30","warning":""},{"cat":"심화·평가","kw":"Brier 0.206 0.209 누가 더 좋은가 차이 0.003","q":"Brier 0.206과 0.209의 차이는 의미 있나요?","ans":"2024년 보정 구간의 예비값으로는 로지스틱이 수치상 0.003 낮습니다. 하지만 차이의 신뢰구간이 아직 없어 유의미한 우위라고 결론 내릴 수 없습니다.","detail":"","src":"PPT 10 / 정리 PDF 22","warning":""},{"cat":"심화·평가","kw":"AUC Brier 다른 이유 확률 정확도 순위","q":"AUC가 높은 모델이 Brier도 반드시 좋나요?","ans":"아닙니다. AUC는 양성과 음성을 구분하는 순위 능력에 가깝고, Brier는 확률 자체의 오차를 봅니다. 확률을 보여 주는 서비스라 Brier와 보정이 중요합니다.","detail":"타이타닉의 AUC 결과와 구급 출동의 Brier 수치를 직접 비교하지 않습니다.","src":"PPT 3·10 / 정리 PDF 22·26 / 일반 지표 개념","warning":""},{"cat":"심화·평가","kw":"확률 보정 isotonic crossfit 학습 재사용","q":"Isotonic 보정이 무엇이고 과적합 가능성은 없나요?","ans":"Isotonic은 예측 점수가 커질수록 보정 확률이 감소하지 않도록 맞추는 비모수 보정 방법입니다. 보정 데이터에 과적합할 수 있어 구간 분리와 독립 시험이 필요합니다.","detail":"자료는 isotonic과 날짜 블록 cross-fit을 명시하지만 구체 폴드 설정까지는 제시하지 않습니다.","src":"정리 PDF 31·20 / 일반 보정 개념","warning":""},{"cat":"심화·평가","kw":"보정 검증 구간 재사용 2024 Brier 낙관적","q":"2024년으로 보정하고 2024년에서 평가하면 낙관적이지 않나요?","ans":"그럴 가능성이 있어 2024년 결과는 예비 결과로 제한해야 합니다. 자료에는 날짜 블록 cross-fit 보정을 언급하고 최종 성능은 별도 2025년 시험으로 확인하도록 설계했습니다.","detail":"2024년 결과가 독립 최종 검증이라고 답하지 않습니다.","src":"정리 PDF 22·31 / 심화 추론","warning":""},{"cat":"심화·평가","kw":"신뢰구간 부트스트랩 날짜 블록 표본 독립","q":"왜 개별 출동이 아니라 날짜 단위로 부트스트랩하나요?","ans":"같은 날 출동은 공통 날씨·교통·신고 상황을 공유하므로 독립이라고 보기 어렵습니다. 날짜 블록 재표집으로 이러한 묶음을 반영한 개선폭 불확실성을 추정하려는 계획입니다.","detail":"현재 자료에는 신뢰구간 계산 결과가 없습니다.","src":"PPT 10 / 정리 PDF 22","warning":""},{"cat":"심화·평가","kw":"2025 final test 한 번 실패하면 다시 튜닝","q":"2025년 시험 성능이 나쁘면 다시 튜닝하면 되지 않나요?","ans":"시험 결과를 보고 반복 수정하면 더 이상 독립 시험이 아니게 됩니다. 최종 평가는 한 번 보고하고, 수정이 필요하다면 새 평가 구간을 확보해야 한다는 원칙으로 설명하겠습니다.","detail":"이는 연구 방법론적 답변이며 현재 결과가 나왔다는 뜻이 아닙니다.","src":"정리 PDF 20·22 / 심화 추론","warning":""},{"cat":"심화·평가","kw":"오차 지표 logloss Brier 차이","q":"Brier와 Log Loss의 차이는 무엇인가요?","ans":"둘 다 확률 예측을 평가하지만 Brier는 제곱오차 평균이고 Log Loss는 실제와 어긋나는 확신 높은 확률에 더 큰 불이익을 줍니다.","detail":"정리 자료는 Brier·log loss를 평가지표로 명시합니다.","src":"정리 PDF 32 / 일반 지표 개념","warning":""},{"cat":"심화·평가","kw":"SHAP 인과 해석 특성 중요도","q":"SHAP이 높으면 그 변수가 지연의 원인인가요?","ans":"아닙니다. SHAP은 모델 예측에 대한 변수 기여 설명이며 인과효과를 증명하지 않습니다. SHAP 분석은 정리 자료에서 후속 계획입니다.","detail":"","src":"정리 PDF 3 / 일반 설명가능성 개념","warning":""},{"cat":"심화·기술","kw":"HDFS 단일노드 분산 저장 표현","q":"단일 서버인데 HDFS를 분산 저장이라고 말해도 되나요?","ans":"HDFS는 분산 저장을 위해 설계된 시스템이지만 현재 프로젝트는 단일 서버 실행으로 정리돼 있습니다. 따라서 실제 다중 노드 분산 클러스터를 운영했다고 표현하지 않겠습니다.","detail":"","src":"PPT 7 / 정리 PDF 12·31","warning":""},{"cat":"심화·기술","kw":"교통 3억 행 계산 추정 실측 5083","q":"교통 데이터 3억 행은 실제 처리 결과인가요?","ans":"아닙니다. PPT에는 링크 5,083개에 매일 24시간과 7년을 적용한 추정 행 수로 표시돼 있습니다. 실측 처리량과 구분해야 합니다.","detail":"","src":"PPT 7","warning":"3억 행 처리 완료라고 발표하지 않음."},{"cat":"심화·기술","kw":"경로 8200만 연산 실제 수행 274만 30","q":"경로 계산 8,200만 회는 실제 수행했나요?","ans":"아닙니다. 약 274만 출동에 후보 경로 30개를 적용한 이론적 연산 횟수 추정치입니다. 경로 기능은 후속 개발 범위입니다.","detail":"","src":"PPT 7 / 개발현황 PDF 2","warning":"예상 연산을 성능 실측 결과로 주장하지 않음."},{"cat":"심화·기술","kw":"4종 조인 시간 정합 공간 정합 중복키","q":"교통·기상·구급 데이터를 어떤 키로 조인하나요?","ans":"자료에서는 신고 이전의 시간과 구 단위 공간 정보를 맞춰 결합한다는 원칙을 제시합니다. 구체 조인 키·다대다 중복 방지 구현은 제공 자료만으로 확인할 수 없습니다.","detail":"시각·관할·관측구간의 일치 여부를 확인하는 것이 후속 검증 사항입니다.","src":"정리 PDF 9·12·31 / 심화 추론","warning":""},{"cat":"심화·기술","kw":"Spark pandas benchmark 처리시간 메모리 기준","q":"pandas와 Spark 중 어느 것이 빠르나요?","ans":"현재 자료에는 동일 작업 실측 결과가 없어 우열을 말할 수 없습니다. 같은 입력·출력을 기준으로 실행 시간과 최대 메모리 사용량을 비교할 계획입니다.","detail":"","src":"PPT 7·18","warning":""},{"cat":"심화·기술","kw":"API 실시간 피처 학습서빙 불일치 training serving skew","q":"학습할 때 계산한 변수와 실시간 API 변수는 동일한가요?","ans":"아직 모델·API 통합이 완료되지 않았으므로 동일성을 검증했다고 말할 수 없습니다. 자료에서는 과거와 실시간 변수를 같은 함수로 계산하도록 설계했습니다.","detail":"이는 학습-서비스 피처 불일치를 줄이기 위한 계획입니다.","src":"정리 PDF 32 / 심화 추론","warning":""},{"cat":"심화·기술","kw":"실시간 수집 실패 fallback 평소값 경고","q":"실시간 날씨나 교통 API가 실패하면 어떻게 하나요?","ans":"자료의 서비스 설계에는 실시간 값이 없을 때 평소값을 사용하고 경고를 표시하는 방안이 있습니다. 다만 실제 장애 대응 검증은 아직 완료되지 않았습니다.","detail":"","src":"정리 PDF 32","warning":""},{"cat":"심화·기술","kw":"Kubernetes 단일서버 필요성 도커컴포즈","q":"서버 한 대인데 Kubernetes까지 필요한가요?","ans":"현재는 기술 학습과 배포 파이프라인 확장을 위한 계획으로 설명할 수 있지만, 단일 서버 운영의 실용성이 검증된 것은 아닙니다. Docker Compose 같은 간단한 방식과 필요성을 비교해야 합니다.","detail":"PPT에는 K8s가 최종 목표로 적혀 있습니다.","src":"PPT 11~12 / 정리 PDF 25·32 / 심화 추론","warning":""},{"cat":"심화·기술","kw":"CI 테스트 51개 ruff 재현성 독립검증","q":"테스트 51개가 있으면 시스템 품질이 검증된 건가요?","ans":"정리 자료에 pytest 51개와 ruff가 기재돼 있지만, 테스트 통과만으로 시스템 전체의 독립 재현·통합 성능이 검증됐다고 보기는 어렵습니다.","detail":"통합 회귀 테스트와 독립 재현은 S5 후속 작업입니다.","src":"정리 PDF 32 / 개발현황 PDF 2","warning":""},{"cat":"심화·기술","kw":"개인정보 위치 정보 민감 응급 신고 보안","q":"구급 출동 데이터를 서비스에 쓰면 개인정보 문제는 없나요?","ans":"현재 자료만으로 데이터 비식별화·접근 통제·재식별 위험 검증을 완료했다고 말할 수 없습니다. 실제 운영 전에는 제공 데이터의 이용 조건과 위치정보 보호를 별도로 검토해야 합니다.","detail":"분석 데이터의 개인정보 처리 절차는 자료에 구체 증빙이 없습니다.","src":"PPT 4 / 정리 PDF 31 / 심화 추론","warning":""},{"cat":"심화·애자일","kw":"SP 24 144 16.7% 프로젝트 진척","q":"24/144SP면 프로젝트가 16.7%밖에 안 된 것 아닌가요?","ans":"24/144는 현재 백로그에서 완료된 추정 포인트의 비율이지 전체 프로젝트 완성도를 직접 뜻하지 않습니다. 이미 확보한 정제·EDA·모델 예비결과는 산출물 근거로 따로 설명하겠습니다.","detail":"","src":"개발현황 PDF 1·3","warning":""},{"cat":"심화·애자일","kw":"Daily Scrum 9건 매일 미팅 회의 증빙","q":"Daily Scrum이라고 해놓고 실제 매일 회의한 게 아니면 잘못된 것 아닌가요?","ans":"현재 9건은 진행상황을 문서로 추적한 기록이며 매일 회의를 개최했다는 증빙은 아닙니다. 실제 회의와 문서 기반 기록을 구분하고 앞으로 운영 주기를 명확히 관리하겠습니다.","detail":"","src":"개발현황 PDF 1~2","warning":""},{"cat":"심화·애자일","kw":"번다운 차트 재구성 실측 가짜 계획선","q":"번다운 차트가 실제 기록이 아니라면 신뢰할 수 있나요?","ans":"실제 일별 작업량을 측정한 차트로 제시하지 않습니다. 문서 확인일 기준 재구성된 진행선과 선형 참고 계획선으로 잔여 작업 규모를 시각화한 자료입니다.","detail":"앞으로 일자별 실제 완료 SP를 누적 기록하면 실측 번다운으로 개선할 수 있습니다.","src":"개발현황 PDF 2","warning":""},{"cat":"심화·애자일","kw":"완료 9 검증중 1 Stories 16 상태 인수조건","q":"완료 카드 9개가 정말 완료됐다는 근거는 무엇인가요?","ans":"백로그의 담당·인수 조건·최신 결과 근거를 연결해 관리하고 있습니다. 완료 판정은 카드별 인수 조건과 연결된 산출물을 확인해야 하며, 9라는 개수만으로 품질을 보장하지는 않습니다.","detail":"","src":"개발현황 PDF 1 / 심화 추론","warning":""},{"cat":"심화·애자일","kw":"스프린트 S1 S2 S3 완료 아님","q":"S1~S3을 진행했다면서 왜 완료한 스프린트가 없나요?","ans":"각 스프린트 범위 중 확보한 산출물과 이월된 작업이 섞여 있습니다. 그래서 S1·S2·S3 전체 완료로 표시하지 않고 실제 Planning에서 스프린트 기간과 이월 작업을 확정하도록 했습니다.","detail":"","src":"개발현황 PDF 2","warning":""},{"cat":"심화·애자일","kw":"Sprint 회고 개선 실제 효과","q":"회고 2건으로 개선 효과를 입증할 수 있나요?","ans":"두 건은 중간발표 문서 점검과 정리 개선 기록이므로 개발 속도나 품질 향상이 입증됐다고 주장하지 않습니다. 후속 작업의 기준과 증빙을 명확히 하는 데 활용하겠습니다.","detail":"","src":"개발현황 PDF 1~2","warning":""},{"cat":"심화·타이타닉","kw":"타이타닉 과제 관련성 왜 발표","q":"왜 구급 출동 발표에 타이타닉 과제를 넣었나요?","ans":"타이타닉은 별도 수업 과제로, 같은 데이터에서도 질문 목적에 따라 적절한 모델이 달라질 수 있음을 보여주기 위해 포함했습니다. 119 모델의 성능 근거로 사용하지는 않습니다.","detail":"","src":"PPT 3 / 정리 PDF 26","warning":""},{"cat":"심화·타이타닉","kw":"AUC 0.866 0.860 차이 유의미","q":"타이타닉 AUC 0.866과 0.860은 통계적으로 차이나나요?","ans":"제공 자료에는 두 수치가 가깝다는 사실은 있으나 두 모델 차이의 유의성 검정 결과는 없습니다. 따라서 확실히 우수하다고 단정하지 않고 질문별 특성으로 비교했습니다.","detail":"","src":"PPT 3 / 정리 PDF 26 / 심화 추론","warning":""},{"cat":"심화·타이타닉","kw":"오즈비 14.6 확률 14배 착각","q":"여성의 오즈비가 14.6이면 생존 확률이 14.6배인가요?","ans":"아닙니다. 오즈비는 확률 자체가 아니라 사건이 일어날 오즈의 비율입니다. 다른 조건을 통제한 모델에서 오즈가 약 14.6배라는 뜻으로 설명해야 합니다.","detail":"","src":"정리 PDF 27 / 일반 통계 개념","warning":""},{"cat":"심화·타이타닉","kw":"중첩 5겹 교차검증 nested leakage","q":"왜 중첩 교차검증을 사용했나요?","ans":"모델 설정을 고르는 과정과 선택된 모델을 평가하는 과정을 구분해 평가 낙관성을 줄이기 위한 방법입니다. 타이타닉 과제에서 같은 조건의 중첩 5겹 교차검증으로 모델을 비교했다고 정리돼 있습니다.","detail":"","src":"PPT 3 / 정리 PDF 27 / 일반 검증 개념","warning":""},{"cat":"심화·타이타닉","kw":"결정트리 98% 생존 표본수 작은 규칙","q":"결정트리에서 생존율 98%는 믿을 수 있는 결과인가요?","ans":"그 비율은 특정 분기 규칙에 속한 학습 데이터 기준이므로 새 데이터에서 같은 확률을 보장하지 않습니다. 자료는 30명 미
